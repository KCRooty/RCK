[package]
name = "rck"
version = "0.1.0"
description = "RCK - optimizador y configurador todo-en-uno para Windows"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.32"

[[bin]]
name = "rck"
path = "src/main.rs"
