id: system.enable-long-paths
category: system
risk: safe
requires_restart: false
description: >-
  Permite rutas de archivo de más de 260 caracteres (MAX_PATH) para
  aplicaciones que lo soportan. Útil en proyectos con árboles de
  dependencias profundos (node_modules, Unreal, Unity). No afecta a
  programas que no lo pidan explícitamente.
targets:
  registry:
    - HKLM\SYSTEM\CurrentControlSet\Control\FileSystem
script: Enable-LongPaths.ps1
test: Test-LongPathsEnabled
apply: Invoke-ApplyEnableLongPaths
revert: Invoke-RevertEnableLongPaths
