id: system.numlock-on-startup
category: system
risk: safe
requires_restart: false
description: >-
  Activa BloqNum automáticamente al iniciar sesión, para todos los
  usuarios del equipo.
targets:
  registry:
    - HKU\.DEFAULT\Control Panel\Keyboard
script: Set-NumlockOnStartup.ps1
test: Test-NumlockOnStartupEnabled
apply: Invoke-ApplyNumlockOnStartup
revert: Invoke-RevertNumlockOnStartup
