id: system.disable-sticky-keys
category: system
risk: safe
requires_restart: false
description: >-
  Desactiva el atajo de teclado que activa Sticky Keys al pulsar Shift 5
  veces seguidas (muy molesto al jugar). No afecta la accesibilidad activada
  manualmente desde Configuración.
targets:
  registry:
    - HKCU\Control Panel\Accessibility\StickyKeys
script: Disable-StickyKeys.ps1
test: Test-StickyKeysDisabled
apply: Invoke-ApplyDisableStickyKeys
revert: Invoke-RevertDisableStickyKeys
