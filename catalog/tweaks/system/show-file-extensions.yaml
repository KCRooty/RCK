id: system.show-file-extensions
category: system
risk: safe
requires_restart: false
description: >-
  Muestra las extensiones de archivo en el Explorador (ocultas por defecto).
  Recomendado por seguridad: ayuda a detectar ejecutables disfrazados.
targets:
  registry:
    - HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
script: Show-FileExtensions.ps1
test: Test-FileExtensionsShown
apply: Invoke-ApplyShowFileExtensions
revert: Invoke-RevertShowFileExtensions
