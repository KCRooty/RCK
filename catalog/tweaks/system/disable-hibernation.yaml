id: system.disable-hibernation
category: system
risk: safe
requires_restart: false
description: >-
  Desactiva la hibernación y elimina hiberfil.sys, liberando espacio en
  disco igual a la RAM instalada. No afecta el modo suspensión normal.
targets:
  registry:
    - HKLM\SYSTEM\CurrentControlSet\Control\Power
script: Disable-Hibernation.ps1
test: Test-HibernationDisabled
apply: Invoke-ApplyDisableHibernation
revert: Invoke-RevertDisableHibernation
